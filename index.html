<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QR Aura - Premium QR Code Generator</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <main id="app">
        <div class="container">
            <header>
                <h1>QR <span class="gradient-text">Aura</span></h1>
                <p>Generate premium, customized QR codes in seconds.</p>
            </header>
            
            <div class="generator-grid">
                <section class="form-section glass">
                    <form id="qr-form">
                        <div class="input-group">
                            <label for="url">Content</label>
                            <input type="text" id="url" placeholder="https://example.com" autocomplete="off">
                        </div>
                        
                        <div class="options-grid">
                            <div class="input-group">
                                <label for="dot-color">Dot Color</label>
                                <div class="color-input-wrapper">
                                    <input type="color" id="dot-color" value="#6366f1">
                                </div>
                            </div>
                            
                            <div class="input-group">
                                <label for="bg-color">Background</label>
                                <div class="color-input-wrapper">
                                    <input type="color" id="bg-color" value="#ffffff">
                                </div>
                            </div>

                            <div class="input-group">
                                <label for="dot-style">Dot Style</label>
                                <select id="dot-style">
                                    <option value="rounded">Rounded</option>
                                    <option value="dots">Dots</option>
                                    <option value="classy">Classy</option>
                                    <option value="square">Square</option>
                                    <option value="extra-rounded">Extra Rounded</option>
                                </select>
                            </div>

                            <div class="input-group">
                                <label for="corner-style">Corner Style</label>
                                <select id="corner-style">
                                    <option value="square">Square</option>
                                    <option value="extra-rounded">Extra Rounded</option>
                                    <option value="dot">Dot</option>
                                </select>
                            </div>
                        </div>

                        <button type="submit" class="generate-btn">
                            Generate QR Code
                        </button>
                    </form>
                </section>

                <section class="preview-section glass">
                    <div id="qr-preview">
                        <!-- QR Code will be rendered here -->
                    </div>
                    
                    <div class="download-actions">
                        <button type="button" id="download-png" class="action-btn">
                            Download PNG
                        </button>
                        <button type="button" id="download-svg" class="action-btn secondary">
                            Download SVG
                        </button>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script type="text/javascript" src="https://unpkg.com/qr-code-styling@1.5.0/lib/qr-code-styling.js"></script>
    <script src="script.js"></script>
</body>
</html>
